name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC version (e.g. 0.2.0-rc.1)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish-rc:
    name: Publish RC
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and publish RC JAR
        run: ./gradlew :delta-connect-dist:publish -Pversion=${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RC Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: delta-connect-dist/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.VERSION }}

      - name: Create pre-release
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "v${{ env.VERSION }}" \
            --notes "Release candidate for testing. Not for production use." \
            --prerelease \
            delta-connect-dist/build/libs/delta-sink-connector-*-all.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
